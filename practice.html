<!DOCTYPE html>
<html>
<head>
<title>Product Grid</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
padding:20px;
}

/* Grid Container */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

/* Product Card */
.card{
background:white;
padding:15px;
text-align:center;
border-radius:10px;
}

/* Image */
.card img{
width:60px;
height:60px;
}

/* Mobile View */
@media(max-width:600px){
.container{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<h2 align="center">Responsive Product Grid</h2>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/60">
<h3>Product 1</h3>
<p>Good quality product</p>
<h4>₹499</h4>
</div>

<div class="card">
<img src="https://via.placeholder.com/60">
<h3>Product 2</h3>
<p>Stylish and durable</p>
<h4>₹799</h4>
</div>

<div class="card">
<img src="https://via.placeholder.com/60">
<h3>Product 3</h3>
<p>Lightweight design</p>
<h4>₹999</h4>
</div>

<div class="card">
<img src="https://via.placeholder.com/60">
<h3>Product 4</h3>
<p>Premium quality</p>
<h4>₹1299</h4>
</div>

</div>

</body>
</html>
