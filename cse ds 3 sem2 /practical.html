<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Pattern Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }

        h2 { color: #333; margin-bottom: 20px; }

        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 90%;
            padding: 12px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover { background-color: #357ABD; }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #2d3436;
            color: #fab1a0;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap; /* Keeps the loop formatting */
            border-radius: 8px;
            text-align: left;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Pattern Maker</h2>
        <input type="number" id="numInput" placeholder="Enter value for n">
        <button onclick="runPattern()">Generate Pattern</button>
        <div id="output">Pattern will appear here...</div>
    </div>

<script src="practical.js"></script>

</body>
</html>
