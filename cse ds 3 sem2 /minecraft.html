    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(#87CEEB, #d0f4ff);
        }

        h1 {
            margin-top: 20px;
        }

        .tools {
            margin: 20px;
        }

        .tools input {
            display: none;
        }

        .tools label {
            padding: 10px 15px;
            background: white;
            margin: 5px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Highlight selected tool */
        #hand:checked + label,
        #shovel:checked + label {
            background: yellow;
        }

        .world {
            display: grid;
            grid-template-columns: repeat(10, 40px);
            justify-content: center;
            gap: 2px;
            margin-top: 20px;
        }

        .world input {
            display: none;
        }

        .block {
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: 0.2s;
        }

        .grass {
            background: green;
        }

        .stone {
            background: gray;
        }

        /* DIGGING LOGIC (CSS Trick) */
        /* Only works visually when checkbox checked */
        .world input:checked + .block {
            background: #87CEEB; /* Air */
        }

        .block:hover {
            transform: scale(0.9);
        }
    </style>
